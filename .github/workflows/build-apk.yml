name: Build Android APK Only

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Create Native Android Project
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat << 'EOF' > package.json
          {
            "name": "k2-ai-studio",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF
          npm install
          npx cap init "K2 AI Studio" "com.k2.aistudio" --web-dir www
          npx cap add android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: K2-Studio-Test-APK
          path: android/app/build/outputs/apk/debug/*.apk
