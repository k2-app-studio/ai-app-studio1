
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K2 AI STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes spin-chakra {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .chakra-spin { animation: spin-chakra 3s linear infinite; }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.8)); }
            50% { filter: drop-shadow(0 0 30px rgba(147, 51, 234, 0.9)); }
        }
        .ai-pulse { animation: pulse-glow 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col font-sans selection:bg-cyan-500 selection:text-black">
    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-cube text-white text-xl"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-xl tracking-wider bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 bg-clip-text text-transparent">K2 AI STUDIO</h1>
                <p class="text-xs text-slate-400">Autonomous Web App & Game Engine</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="px-3 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 rounded-full text-xs font-semibold flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                5/5 Daily Credits
            </span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden p-4 gap-4 max-w-7xl mx-auto w-full">
        <!-- Control Panel -->
        <section class="w-full lg:w-5/12 flex flex-col gap-4 bg-slate-900/40 p-5 rounded-2xl border border-slate-800/80 backdrop-blur">
            <div>
                <label class="text-sm font-semibold text-slate-300 mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-cyan-400"></i> प्रॉम्प्ट लिखें (हिंदी या English):
                </label>
                <textarea id="promptInput" rows="4" placeholder="उदाहरण: किराना दुकान का बिलिंग कैलकुलेटर बनाओ, या एक स्नेक गेम बनाओ..." class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition resize-none"></textarea>
            </div>

            <button id="generateBtn" onclick="startGeneration()" class="w-full py-3.5 px-4 bg-gradient-to-r from-cyan-500 via-blue-600 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg shadow-cyan-500/20 transition active:scale-[0.98] flex items-center justify-center gap-2">
                <span>🚀 ऐप / गेम बनाएँ</span>
            </button>

            <!-- Loading Indicator -->
            <div id="loaderArea" class="hidden flex-col items-center justify-center py-6 gap-3">
                <div class="relative w-16 h-16 flex items-center justify-center">
                    <i class="fa-solid fa-dharmachakra text-cyan-400 text-4xl chakra-spin"></i>
                    <i class="fa-solid fa-brain text-purple-400 text-xl absolute ai-pulse"></i>
                </div>
                <p id="statusMsg" class="text-xs font-medium text-slate-400 animate-pulse">कोड जनरेट हो रहा है...</p>
            </div>

            <div class="mt-auto pt-4 border-t border-slate-800/60 text-[11px] text-slate-500 flex justify-between">
                <span>Supabase Sync: Active</span>
                <span>Hugging Face: Connected</span>
            </div>
        </section>

        <!-- Preview Viewport -->
        <section class="w-full lg:w-7/12 flex flex-col bg-slate-900/40 rounded-2xl border border-slate-800/80 backdrop-blur overflow-hidden min-h-[500px]">
            <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between bg-slate-950/40">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-rose-500"></span>
                    <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                    <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                    <span class="text-xs text-slate-400 ml-2 font-mono">mobile-preview://screen</span>
                </div>
                <button onclick="reloadPreview()" class="text-xs text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> रीसेट
                </button>
            </div>

            <div class="flex-1 p-4 flex items-center justify-center bg-slate-950/60">
                <div class="w-[320px] h-[560px] bg-black border-4 border-slate-700 rounded-[36px] shadow-2xl overflow-hidden relative flex flex-col">
                    <div class="h-5 bg-slate-900 flex justify-center items-center">
                        <div class="w-16 h-3 bg-slate-800 rounded-full"></div>
                    </div>
                    <iframe id="previewFrame" class="w-full flex-1 bg-white border-0" srcdoc="<body style='font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#0f172a;color:#94a3b8;'><p style='text-align:center;'>प्रॉम्प्ट लिखकर 'ऐप बनाएँ' दबाएँ</p></body>"></iframe>
                </div>
            </div>
        </section>
    </main>

    <script>
        function startGeneration() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                alert('कृपया कोई प्रॉम्प्ट लिखें!');
                return;
            }

            const loader = document.getElementById('loaderArea');
            const statusMsg = document.getElementById('statusMsg');
            const frame = document.getElementById('previewFrame');

            loader.classList.remove('hidden');
            loader.classList.add('flex');
            statusMsg.innerText = 'AI लॉजिक प्रोसेस कर रहा है...';

            setTimeout(() => {
                statusMsg.innerText = 'HTML / CSS / JS संकलित हो रहा है...';
            }, 1000);

            setTimeout(() => {
                loader.classList.remove('flex');
                loader.classList.add('hidden');

                const demoAppHtml = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset='utf-8'>
                        <meta name='viewport' content='width=device-width, initial-scale=1'>
                        <script src='https://cdn.tailwindcss.com'><\/script>
                    </head>
                    <body class='p-4 bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center text-center'>
                        <div class='bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 w-full'>
                            <h2 class='text-xl font-bold text-cyan-400 mb-2'>🎉 ऐप तैयार है!</h2>
                            <p class='text-xs text-slate-300 mb-4'>प्रॉम्प्ट: "${prompt}"</p>
                            <button onclick='alert(\"नमस्ते, आपका ऐप सफलतापूर्वक चल रहा है!\")' class='w-full py-2 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-lg text-sm font-bold shadow'>क्लिक करें</button>
                        </div>
                    </body>
                    </html>
                `;
                frame.srcdoc = demoAppHtml;
            }, 2500);
        }

        function reloadPreview() {
            document.getElementById('previewFrame').srcdoc = "<body style='font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#0f172a;color:#94a3b8;'><p style='text-align:center;'>प्रॉम्प्ट लिखकर 'ऐप बनाएँ' दबाएँ</p></body>";
        }
    </script>
</body>
</html>
